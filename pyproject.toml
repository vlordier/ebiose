[project]
name = "ebiose"
version = "0.1.0"
description = "Ebiose core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "elasticsearch>=9.0.2",
    "ipykernel>=6.29.5",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.74",
    "langchain-openai>=0.3.30",
    "langfuse>=3.2.4",
    "langgraph>=0.6.4",
    "litellm>=1.60.0",
    "loguru>=0.7.3",
    "nest-asyncio>=1.6.0",
    "openai<1.100",
    "openapi-client",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "ruff>=0.9.6",
    "mypy>=1.11.0",
    "seaborn>=0.13.2",
    "sortedcontainers>=2.4.0",
]
# generated ebiose cloud sdk
# "openapi_client @ file://./ebiose/generated_cloud_sdk"
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["notebooks", "ebiose/generated_cloud_sdk", "ebiose/stubs", "typing_stubs"]

[tool.pyrefly.errors]
redundant-condition = "error"
# ruff handles Python files by default, other files are handled separately

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # one blank line before class (conflicts with D211)
  "E501",    # line too long
  "FIX002",  # Lines has TODO
  "PT023",   # messes up pytest.mark.costly
  "TD003",   # issue link in a TODO comment
  "D100",    # Missing docstring in public module
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D103",    # Missing docstring in public function
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic method
  "D106",    # Missing docstring in nested public class
  "D213",    # multi-line-summary-second-line (conflicts with D212)
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.ruff.lint.per-file-ignores]
# YAML files - focus on syntax and structure
"*.yml" = ["E902"]  # Ignore file encoding issues for YAML
"*.yaml" = ["E902"]  # Ignore file encoding issues for YAML
# Markdown files - be more lenient
"*.md" = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D106"]
# Jupyter notebooks - very lenient
"*.ipynb" = ["ALL"]
# Docker and Makefiles - infrastructure files
"Dockerfile*" = ["E501", "D100", "D101"]
"Makefile*" = ["E501", "D100", "D101"]
# Type stubs - third-party library stubs with intentional Any usage
"typing_stubs/**/*.pyi" = ["ALL"]
"ebiose/stubs/**/*.pyi" = ["ALL"]
# Code sandbox execution - intentionally uses exec() with restricted builtins for safe user code execution
"ebiose/core/engines/graph_engine/nodes/code_node.py" = ["S102"]
# Test files - allow assert, print, relaxed typing
"tests/**/*.py" = ["S101", "T201", "ANN", "D"]
"test_*.py" = ["S101", "T201", "ANN", "D"]


[tool.mypy]
python_version = "3.12"
python_executable = "python3.12"
mypy_path = ["typing_stubs"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Advanced features
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
extra_checks = true
exclude = [
    "notebooks/",
    "ebiose/generated_cloud_sdk/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


# Additional linting tools for multi-file support
[tool.yamllint]
config = """
extends: default
rules:
  line-length: disable
  comments-indentation: disable
  truthy: disable
"""

[tool.yamlfix]
include = ["*.yml", "*.yaml"]
exclude = ["notebooks/**"]

[tool.yamlfmt]
include = ["*.yml", "*.yaml"]
exclude = ["notebooks/**"]

# Docker linting configuration
[tool.hadolint]
ignored-codes = ["DL3008", "DL3013", "DL3018"]  # Common acceptable warnings

[tool.pyrefly]
project-excludes = [
    "**/notebooks/",
    "**/ebiose/generated_cloud_sdk/",
]
search-path = ["typing_stubs"]
python-interpreter-path = "/Users/vincent/.pyenv/shims/python3.12"
python-version = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "types-aiofiles>=25.1.0.20251011",
    "types-psutil>=7.2.1.20260116",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
    "types-tqdm>=4.67.0.20250809",
    "types-tzlocal>=5.1.0.1",
]
